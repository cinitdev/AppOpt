# 每个应用一行，选项可组合；只保留一个包名，不附加线程名称。
# 包名：自动分配；包名,fallback：自动分配与主进程兜底。
# 包名,record：仅性能记录，不开启自动分配或校准。
# 包名,auto,record：自动分配与性能记录。
# 包名,fallback,record：自动分配、主进程兜底与性能记录。
# 默认算法：平均负载达到 5% 的活跃线程参与自动分配。
# 自定义：包名,custom=2:0-3|30:4-6|70:7（示例核心编号须按设备修改）。
# 整数阈值 1～100%，最多 8 档；| 分隔档位，+ 分隔不连续核心，如 2:0-3+6。
# 取平均负载达到的最高档；custom 可与 fallback、record 组合，隐含开启自动分配。
# 同一行只允许一个 custom；重复包名合并开关，自定义档位取最后一条有效配置。
# 开启自动分配后暂停该应用已有规则和规则检测，原规则保留；仅性能记录不影响规则。
# fallback 复用 applist.conf 中的主进程核心范围，仅接管均值低于当前最低门槛的主进程线程。
