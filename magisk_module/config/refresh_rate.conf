# 柒夏线程刷新率管理，默认关闭。0 为设备最低档，-1 为最高档。
enabled=0
active_hz=-1
idle_hz=0
lock_hz=0
gesture_hz=-1
battery_hz=0
battery_threshold=5
brightness_hz=-1
brightness_threshold=0
tap_ms=900
scroll_ms=2000
# auto 按设备决定：Android 15 及更新的天玑默认启用；0/1 为用户明确选择。
strict=auto
compatible=auto
# 每应用：app.包名=闲置Hz,活动Hz；-2 表示跟随全局，应用和游戏使用相同策略。
# DisplayModes：物理模式 ID 按设备刷新率从高到低排列，以空格分隔，-1 表示自动。
# App 按当前分辨率的实际档位生成行内输入，不限定刷新率和档位数量。
display_modes=-1 -1 -1
